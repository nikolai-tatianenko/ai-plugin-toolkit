name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: build and test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for inspector browser tests
        run: pnpm --filter @ai-plugin-toolkit/inspector exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
      - name: Offline end-to-end demo from a clean checkout
        run: bash examples/synthetic/demo.sh "$RUNNER_TEMP/loom-demo"
      - name: Rerun is idempotent
        run: |
          demo="$RUNNER_TEMP/loom-demo"
          node apps/cli/dist/main.js --dir "$demo" ingest examples/synthetic/kickoff-conversation.json --json | grep -q '"existing": 1'
          node apps/cli/dist/main.js --dir "$demo" generate --json | grep -q '"conflicts": 0'
      - name: Extraction evaluation (fixture provider)
        run: pnpm eval
      - name: Release gate (unverified release requirements reported as pending)
        run: pnpm release:check --allow-pending=upstream,live,macos

  macos:
    name: clean macOS install (node ${{ matrix.node }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify clean install and packed CLI workflow
        run: pnpm verify:release -- macos
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-evidence-node-${{ matrix.node }}
          path: .release-evidence/macos.json
          if-no-files-found: error
